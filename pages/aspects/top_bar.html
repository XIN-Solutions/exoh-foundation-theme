<div class="space-y-6">
    <div>
        <h2 class="font-headline text-lg font-semibold tracking-tight text-admin-text">Top Bar</h2>
        <p class="mt-1 text-sm text-admin-muted">
            Control the contact strip shown above the main navigation on the live site.
        </p>
    </div>

    <div class="rounded-xl border border-admin-border bg-admin-surface p-5 shadow-card-sm">
        <label class="flex items-center justify-between gap-3">
            <span class="text-sm text-admin-text">Show top bar</span>
            <button type="button"
                    data-guide-switch
                    role="switch"
                    :aria-checked="enabled === 'yes' ? 'true' : 'false'"
                    @click="enabled = enabled === 'yes' ? 'no' : 'yes'"
                    :class="enabled === 'yes' ? 'bg-admin-primary' : 'bg-admin-border'"
                    class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors focus:outline-none focus:ring-2 focus:ring-admin-primary focus:ring-offset-2">
                <span data-guide-switch-knob
                      class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition"
                      :class="enabled === 'yes' ? 'translate-x-5' : 'translate-x-0'"></span>
            </button>
            <input type="checkbox"
                   class="sr-only"
                   id="topBarEnabledInp"
                   :checked="enabled === 'yes'"
                   @change="enabled = $event.target.checked ? 'yes' : 'no'">
        </label>
        <input type="hidden" name="top_bar[enabled]" x-model="enabled">
        <p class="mt-3 text-xs text-admin-muted">
            Phone and email in the strip come from Footer contact details.
        </p>
    </div>
</div>
